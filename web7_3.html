<!DOCTYPE html>
<html>
<head>
<title>Car Body Workshop</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body{font-family:Arial;text-align:center;background:#eee}
.workshop{background:white;width:700px;margin:auto;padding:20px;border-radius:10px}
.controls{margin:20px}
select{padding:8px;margin:10px}
.car{position:relative;width:500px;height:220px;margin:40px auto}
.body{position:absolute;width:450px;height:100px;background:red;left:25px;top:80px;border-radius:30px 50px 20px 20px}
.roof{position:absolute;width:280px;height:80px;background:red;left:110px;top:25px;border-radius:100px 100px 0 0}
.glass{position:absolute;width:100px;height:55px;background:lightblue;left:140px;top:35px;border-radius:50px 10px 0 0}
.glass2{position:absolute;width:100px;height:55px;background:lightblue;left:260px;top:35px;border-radius:10px 50px 0 0}
.tyre{position:absolute;width:65px;height:65px;background:black;border-radius:50%;top:145px}
.tyre1{left:80px}
.tyre2{right:80px}
.wheel{position:absolute;width:25px;height:25px;background:gray;border-radius:50%;top:20px;left:20px}
</style>
</head>
<body>
<div class="workshop">
<h1>Car Body Workshop</h1>
<div class="controls">
<label>Car Color:</label>
<select id="carColor">
<option value="red">Red</option>
<option value="blue">Blue</option>
<option value="green">Green</option>
<option value="yellow">Yellow</option>
<option value="black">Black</option>
</select>
<br>
<label>Glass Tint:</label>
<select id="glassTint">
<option value="lightblue">Light</option>
<option value="gray">Medium</option>
<option value="black">Dark</option>
</select>
<br>
<label>Tyre Size:</label>
<select id="tyreSize">
<option value="55px">Small</option>
<option value="65px" selected>Medium</option>
<option value="80px">Large</option>
</select>
</div>
<div class="car">
<div class="roof"></div>
<div class="glass"></div>
<div class="glass2"></div>
<div class="body"></div>
<div class="tyre tyre1"><div class="wheel"></div></div>
<div class="tyre tyre2"><div class="wheel"></div></div>
</div>
</div>
<script>
$(document).ready(function(){
$("#carColor").change(function(){
var color=$(this).val();
$(".body").css("background-color",color);
$(".roof").css("background-color",color);
});
$("#glassTint").change(function(){
var tint=$(this).val();
$(".glass").css("background-color",tint);
$(".glass2").css("background-color",tint);
});
$("#tyreSize").change(function(){
var size=$(this).val();
$(".tyre").css({"width":size,"height":size});
});
});
</script>
</body>
</html>
